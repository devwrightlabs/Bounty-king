<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Operation: Archipelago — Perf Prototype</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;touch-action:none;user-select:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block}

/* ── Stats overlay ── */
#stats{
  position:fixed;top:8px;left:8px;
  background:rgba(0,0,0,.72);color:#0f0;
  font:11px/1.6 'Courier New',monospace;
  padding:6px 9px;border-radius:5px;
  pointer-events:none;z-index:100;min-width:190px;
}
#stats.warn{color:#ff0}

/* ── Crosshair ── */
#xhair{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;z-index:90;
  width:22px;height:22px;
}
#xhair::before,#xhair::after{
  content:'';position:absolute;background:rgba(255,255,255,.9);
}
#xhair::before{width:2px;height:22px;left:10px;top:0}
#xhair::after{width:22px;height:2px;top:10px;left:0}
#xhair.hit::before,#xhair.hit::after{background:#f33}

/* ── Hit-marker X ── */
#hm{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(45deg);
  pointer-events:none;z-index:91;
  width:28px;height:28px;opacity:0;
  transition:opacity .06s;
}
#hm.show{opacity:1}
#hm::before,#hm::after{content:'';position:absolute;background:#f33}
#hm::before{width:3px;height:12px;left:12px;top:0}
#hm::after{width:12px;height:3px;top:12px;left:0}

/* ── Virtual joystick ── */
#jbase{
  position:fixed;width:120px;height:120px;border-radius:50%;
  border:2px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.07);
  display:none;pointer-events:none;z-index:80;
}
#jstick{
  position:fixed;width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.5);
  display:none;pointer-events:none;z-index:81;
}

/* ── Action buttons ── */
.btn{
  position:fixed;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font:bold 13px sans-serif;
  touch-action:none;z-index:80;
  border:3px solid;
}
#fire-btn{
  bottom:38px;right:28px;
  width:82px;height:82px;
  background:rgba(220,40,40,.75);
  border-color:rgba(255,100,100,.8);
}
#jump-btn{
  bottom:148px;right:120px;
  width:58px;height:58px;
  background:rgba(40,120,220,.75);
  border-color:rgba(100,160,255,.8);
}

/* ── Damage indicator ── */
#dmg{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;z-index:95;
  font:bold 28px sans-serif;color:#f44;
  opacity:0;text-shadow:0 0 8px #000;
}

/* ── Settings toggle ── */
#stog{
  position:fixed;top:8px;right:8px;
  width:44px;height:44px;border-radius:6px;
  background:rgba(0,0,0,.75);border:1px solid #555;
  color:#fff;font:20px sans-serif;
  display:flex;align-items:center;justify-content:center;
  z-index:110;cursor:pointer;touch-action:manipulation;
}

/* ── Settings panel ── */
#spanel{
  position:fixed;top:60px;right:8px;
  background:rgba(0,0,0,.88);border:1px solid #444;
  border-radius:8px;padding:12px;z-index:110;
  display:none;min-width:220px;
  color:#ccc;font:13px sans-serif;
}
#spanel b{color:#fff;font-size:14px}
#spanel label{display:flex;align-items:center;gap:6px;margin:10px 0 2px}
#spanel input[type=range]{width:100%;margin-top:4px}
#spanel button{
  width:100%;margin-top:8px;padding:9px;
  background:#2a2a2a;border:1px solid #555;
  border-radius:5px;color:#fff;font:13px sans-serif;
  cursor:pointer;text-align:left;
}
#spanel button:active{background:#444}
#rpt{
  margin-top:8px;padding:7px;
  background:#0a0a0a;border:1px solid #333;
  border-radius:4px;font:10px 'Courier New',monospace;
  color:#0f0;white-space:pre;overflow-x:auto;
  display:none;max-height:220px;overflow-y:auto;
}
#res-lbl{color:#aaa;font-size:11px}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="stats">Loading…</div>
<div id="xhair"></div>
<div id="hm"></div>
<div id="jbase"></div>
<div id="jstick"></div>
<div id="dmg"></div>

<div class="btn" id="fire-btn">FIRE</div>
<div class="btn" id="jump-btn">▲</div>

<div id="stog">≡</div>
<div id="spanel">
  <b>Performance Settings</b>

  <label>Res Scale <span id="res-lbl">0.75×</span></label>
  <input type="range" id="res-sl" min="0.2" max="1.5" step="0.05" value="0.75">

  <label><input type="checkbox" id="shad-tog" checked> Shadows</label>

  <button id="stress-btn">⊕ Stress Test  (+20 dummies)</button>
  <button id="report-btn">📋 Session Report</button>
  <div id="rpt"></div>
</div>

<!-- Three.js r160 via importmap — no build step required -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ═══════════════════════════════════════════════════════════════════════════
//  RENDERER
// ═══════════════════════════════════════════════════════════════════════════
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.shadowMap.enabled  = true;
renderer.shadowMap.type     = THREE.PCFSoftShadowMap;
renderer.outputColorSpace   = THREE.LinearSRGBColorSpace;

// Resolution scaling — controlled separately from DPR
// renderer.setPixelRatio(1) + manual setSize keeps CSS at 100%/100% while
// buffer size is width*scale, giving true upscale/downscale.
let resScale = 0.75;
renderer.setPixelRatio(1);
function applyResScale() {
  const w = Math.floor(window.innerWidth  * resScale);
  const h = Math.floor(window.innerHeight * resScale);
  renderer.setSize(w, h, false);   // false = don't touch CSS
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  document.getElementById('res-lbl').textContent = resScale.toFixed(2) + '×';
}

window.addEventListener('resize', applyResScale);

// ═══════════════════════════════════════════════════════════════════════════
//  SCENE & CAMERA
// ═══════════════════════════════════════════════════════════════════════════
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7ab0d4);
scene.fog = new THREE.Fog(0x7ab0d4, 35, 90);

const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 200);
camera.rotation.order = 'YXZ';
applyResScale();  // sets size + aspect

// ── Lighting ──────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfffbe0, 1.3);
sun.position.set(20, 40, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near   = 1;
sun.shadow.camera.far    = 140;
sun.shadow.camera.left   = -40;
sun.shadow.camera.right  =  40;
sun.shadow.camera.top    =  40;
sun.shadow.camera.bottom = -40;
scene.add(sun);

// ═══════════════════════════════════════════════════════════════════════════
//  GEOMETRY HELPERS
// ═══════════════════════════════════════════════════════════════════════════
const collidables = [];  // Box3 list for static geo

function makeBox(px, py, pz, w, h, d, color) {
  const geo  = new THREE.BoxGeometry(w, h, d);
  const mat  = new THREE.MeshLambertMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(px, py, pz);
  mesh.castShadow    = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  // Store static AABB
  const box = new THREE.Box3().setFromObject(mesh);
  collidables.push(box);
  return mesh;
}

// ── Floor ────────────────────────────────────────────────────────────────
const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshLambertMaterial({ color: 0x4a7c40 })
);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.receiveShadow = true;
scene.add(floorMesh);

// ── Perimeter walls ───────────────────────────────────────────────────────
makeBox(  0, 3, -50, 100, 6,  1,  0x6e6e6e);
makeBox(  0, 3,  50, 100, 6,  1,  0x6e6e6e);
makeBox(-50, 3,   0,   1, 6, 100, 0x6e6e6e);
makeBox( 50, 3,   0,   1, 6, 100, 0x6e6e6e);

// ── Cover boxes (deliberately varied for interesting firefights) ───────────
[
  [ 6, 1.0,  -9,  3, 2, 3],
  [-7, 1.0, -13,  4, 2, 1.5],
  [13, 1.0,   5,  2, 2, 6],
  [-11,1.0,   8,  3, 2, 3],
  [ 0, 1.0,  16,  8, 2, 1.5],
  [-16,1.0,  -5,  2, 3, 2],
  [ 9, 2.5, -21,  4, 5, 4],
  [-9, 1.0,  21,  6, 2, 2],
  [21, 1.0, -16,  2, 2, 8],
  [-21,1.0,  16,  3, 2, 3],
  [ 5, 1.0,  30,  5, 2, 2],
  [-5, 1.0, -30,  5, 2, 2],
].forEach(([x,y,z,w,h,d]) => makeBox(x,y,z,w,h,d, 0x8b7355));

// ═══════════════════════════════════════════════════════════════════════════
//  DUMMIES
// ═══════════════════════════════════════════════════════════════════════════
const dummies      = [];
const _dummyGeo    = new THREE.BoxGeometry(0.8, 1.8, 0.8);
const _matNormal   = new THREE.MeshLambertMaterial({ color: 0xdd3333 });
const _matHit      = new THREE.MeshLambertMaterial({ color: 0xffffff });

function spawnDummies(n) {
  for (let i = 0; i < n; i++) {
    const mesh = new THREE.Mesh(_dummyGeo, _matNormal.clone());
    mesh.castShadow    = true;
    mesh.receiveShadow = true;
    const a = Math.random() * Math.PI * 2;
    const r = 6 + Math.random() * 32;
    mesh.position.set(Math.cos(a) * r, 0.9, Math.sin(a) * r);
    scene.add(mesh);
    dummies.push({ mesh, hp: 100, hitTimer: 0 });
  }
}
spawnDummies(5);

// ═══════════════════════════════════════════════════════════════════════════
//  PLAYER
// ═══════════════════════════════════════════════════════════════════════════
const WALK_SPEED = 5.5;
const JUMP_VEL   = 7.0;
const GRAVITY    = -18.0;
const EYE_H      = 1.7;
const P_RAD      = 0.38;
const LOOK_SENS  = 0.22;  // °/px
const JOY_MAX    = 58;    // joystick max radius px

const playerPos = new THREE.Vector3(0, EYE_H, 8);
let velY        = 0;
let grounded    = false;
let yaw         = 0;   // degrees, accumulated
let pitch       = 0;   // degrees, clamped ±80

// ═══════════════════════════════════════════════════════════════════════════
//  MULTI-TOUCH — pointer events, tracked by pointerId
// ═══════════════════════════════════════════════════════════════════════════
// Each active pointer lives in this map:
//   id → { role: 'move'|'look', x, y }
const ptrMap      = new Map();
let moveId        = -1;   // pointerId owning the move joystick
let lookId        = -1;   // pointerId owning the look drag

const joystick    = { x: 0, y: 0 };
let joyOrigin     = null;   // {x, y} screen coords of joystick anchor
let lookPrevX     = 0;
let lookPrevY     = 0;
let lookDX        = 0;      // accumulated look delta (consumed each frame)
let lookDY        = 0;

let fireQueued    = false;
let jumpQueued    = false;

// Joystick visual elements
const jBase  = document.getElementById('jbase');
const jStick = document.getElementById('jstick');

function _setJoyVisual() {
  if (!joyOrigin) {
    jBase.style.display = jStick.style.display = 'none';
    return;
  }
  const bx = joyOrigin.x - 60, by = joyOrigin.y - 60;
  jBase.style.cssText  += `;left:${bx}px;top:${by}px;display:block`;
  jStick.style.cssText += `;left:${joyOrigin.x - 26 + joystick.x * JOY_MAX}px;` +
                           `top:${joyOrigin.y  - 26 + joystick.y * JOY_MAX}px;display:block`;
}

// The canvas captures all raw canvas pointers; fire/jump buttons have their own.
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);

  const isLeft = e.clientX < window.innerWidth * 0.5;

  if (isLeft && moveId === -1) {
    moveId     = e.pointerId;
    joyOrigin  = { x: e.clientX, y: e.clientY };
    joystick.x = joystick.y = 0;
    ptrMap.set(e.pointerId, { role: 'move' });
    _setJoyVisual();
  } else if (!isLeft && lookId === -1) {
    lookId    = e.pointerId;
    lookPrevX = e.clientX;
    lookPrevY = e.clientY;
    ptrMap.set(e.pointerId, { role: 'look' });
  }
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  e.preventDefault();
  if (e.pointerId === moveId && joyOrigin) {
    const dx  = (e.clientX - joyOrigin.x) / JOY_MAX;
    const dy  = (e.clientY - joyOrigin.y) / JOY_MAX;
    const len = Math.hypot(dx, dy);
    joystick.x = len > 1 ? dx / len : dx;
    joystick.y = len > 1 ? dy / len : dy;
    _setJoyVisual();
  } else if (e.pointerId === lookId) {
    lookDX   += (e.clientX - lookPrevX) * LOOK_SENS;
    lookDY   += (e.clientY - lookPrevY) * LOOK_SENS;
    lookPrevX = e.clientX;
    lookPrevY = e.clientY;
  }
}, { passive: false });

function _releasePtr(id) {
  if (id === moveId) {
    moveId = -1; joyOrigin = null;
    joystick.x = joystick.y = 0;
    _setJoyVisual();
  } else if (id === lookId) {
    lookId = -1;
  }
  ptrMap.delete(id);
}
canvas.addEventListener('pointerup',     e => { e.preventDefault(); _releasePtr(e.pointerId); }, { passive:false });
canvas.addEventListener('pointercancel', e => { e.preventDefault(); _releasePtr(e.pointerId); }, { passive:false });

// Fire & Jump — separate DOM elements get separate pointerIds, so they never
// conflict with the look drag running on the canvas.
document.getElementById('fire-btn').addEventListener('pointerdown', e => {
  e.stopPropagation();
  fireQueued = true;
});
document.getElementById('jump-btn').addEventListener('pointerdown', e => {
  e.stopPropagation();
  jumpQueued = true;
});

// ═══════════════════════════════════════════════════════════════════════════
//  COLLISION
// ═══════════════════════════════════════════════════════════════════════════
const _pMin = new THREE.Vector3();
const _pMax = new THREE.Vector3();
const _pBox = new THREE.Box3();

function resolveAxis(axis) {
  _pMin.set(playerPos.x - P_RAD, playerPos.y - EYE_H, playerPos.z - P_RAD);
  _pMax.set(playerPos.x + P_RAD, playerPos.y + 0.15,  playerPos.z + P_RAD);
  _pBox.set(_pMin, _pMax);
  for (const box of collidables) {
    if (!_pBox.intersectsBox(box)) continue;
    if (axis === 'x') {
      const cx = (box.min.x + box.max.x) * 0.5;
      playerPos.x = playerPos.x < cx
        ? box.min.x - P_RAD - 0.01
        : box.max.x + P_RAD + 0.01;
    } else {
      const cz = (box.min.z + box.max.z) * 0.5;
      playerPos.z = playerPos.z < cz
        ? box.min.z - P_RAD - 0.01
        : box.max.z + P_RAD + 0.01;
    }
    // Recompute box after push
    _pMin.set(playerPos.x - P_RAD, playerPos.y - EYE_H, playerPos.z - P_RAD);
    _pMax.set(playerPos.x + P_RAD, playerPos.y + 0.15,  playerPos.z + P_RAD);
    _pBox.set(_pMin, _pMax);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  RAYCAST / GUN
// ═══════════════════════════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const _center   = new THREE.Vector2(0, 0);
const xhair     = document.getElementById('xhair');
const hmEl      = document.getElementById('hm');
const dmgEl     = document.getElementById('dmg');

let hmTimer   = 0;
let dmgTimer  = 0;
let dmgText   = '';

function doFire() {
  raycaster.setFromCamera(_center, camera);
  const meshes = dummies.map(d => d.mesh);
  const hits   = raycaster.intersectObjects(meshes, false);
  if (hits.length > 0) {
    const d = dummies.find(e => e.mesh === hits[0].object);
    if (d) {
      const dmg = 25 + Math.floor(Math.random() * 15);
      d.hp -= dmg;
      d.hitTimer = 0.14;
      d.mesh.material.color.set(0xffffff);
      hmTimer  = 0.22;
      hmEl.classList.add('show');
      xhair.classList.add('hit');
      // Damage number
      dmgText  = '-' + dmg;
      dmgTimer = 0.6;
      if (d.hp <= 0) {
        scene.remove(d.mesh);
        dummies.splice(dummies.indexOf(d), 1);
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  INSTRUMENTATION  — all values from the real render loop
// ═══════════════════════════════════════════════════════════════════════════
const RING   = 180;                     // 3 s window at 60 fps
const fpsRing = new Float32Array(RING);
const ftRing  = new Float32Array(RING);
let rHead     = 0;

const sessionT0 = performance.now();
let totalFrames = 0;
let sumFPS      = 0;
let minFPS_ses  = Infinity;
let worstFT     = 0;          // worst single frame time in ms (whole session)
let peakDC      = 0;          // peak draw calls

// Rolling helpers — reads fpsRing/ftRing over last RING frames
function rollingAvg(arr) {
  let s = 0, n = 0;
  for (let i = 0; i < RING; i++) { if (arr[i] > 0) { s += arr[i]; n++; } }
  return n > 0 ? s / n : 0;
}
function rollingMin(arr) {
  let m = Infinity;
  for (let i = 0; i < RING; i++) { if (arr[i] > 0 && arr[i] < m) m = arr[i]; }
  return m === Infinity ? 0 : m;
}
function percentile1Low(arr) {
  // 1% low of frame time ring (highest 1% frame times → lowest fps floor)
  const valid = Array.from(arr).filter(v => v > 0).sort((a,b) => b - a);
  const idx = Math.max(0, Math.floor(valid.length * 0.01));
  return valid[idx] || 0;
}

const statsEl = document.getElementById('stats');

function updateStats(ft) {
  const fps = ft > 0 ? 1000 / ft : 0;

  // Write into ring buffers
  fpsRing[rHead] = fps;
  ftRing[rHead]  = ft;
  rHead = (rHead + 1) % RING;

  // Session accumulators
  totalFrames++;
  sumFPS += fps;
  if (fps > 1 && fps < minFPS_ses)  minFPS_ses = fps;
  if (ft > worstFT)                 worstFT = ft;

  const dc = renderer.info.render.calls;
  const tr = renderer.info.render.triangles;
  if (dc > peakDC) peakDC = dc;

  const avgFPS   = rollingAvg(fpsRing);
  const minFPS3s = rollingMin(fpsRing);
  const spike1   = percentile1Low(ftRing);  // highest 1% of frame times
  const w        = Math.floor(window.innerWidth  * resScale);
  const h        = Math.floor(window.innerHeight * resScale);
  const dpr      = window.devicePixelRatio;

  statsEl.innerHTML =
    `FPS cur:<b>${fps.toFixed(0)}</b>  avg:${avgFPS.toFixed(0)}  min/3s:<b>${minFPS3s.toFixed(0)}</b>\n` +
    `Frame: ${ft.toFixed(1)}ms  worst:${worstFT.toFixed(1)}ms  1%low:${spike1.toFixed(1)}ms\n` +
    `DC:${dc}  peak:${peakDC}  Tris:${tr.toLocaleString()}\n` +
    `DPR:${dpr}  Buf:${w}×${h} (${(resScale*100).toFixed(0)}%)\n` +
    `Dummies:${dummies.length}  Uptime:${((performance.now()-sessionT0)/1000).toFixed(0)}s`;

  // Warn when FPS drops hard
  statsEl.className = minFPS3s < 20 ? 'warn' : '';
}

function sessionReport() {
  const elapsed   = ((performance.now() - sessionT0) / 1000).toFixed(1);
  const avgFPS_s  = (sumFPS / Math.max(totalFrames, 1)).toFixed(1);
  const w = Math.floor(window.innerWidth  * resScale);
  const h = Math.floor(window.innerHeight * resScale);
  return [
    '=== Operation: Archipelago — Session Report ===',
    `Elapsed:      ${elapsed}s`,
    `FPS  avg:     ${avgFPS_s}`,
    `FPS  min ses: ${minFPS_ses < Infinity ? minFPS_ses.toFixed(1) : 'n/a'}`,
    `FPS  min 3s:  ${rollingMin(fpsRing).toFixed(1)}`,
    `Worst frame:  ${worstFT.toFixed(1)} ms`,
    `1% low ft:    ${percentile1Low(ftRing).toFixed(1)} ms`,
    `Peak DC:      ${peakDC}`,
    `Dummies now:  ${dummies.length}`,
    `Res scale:    ${resScale.toFixed(2)}× → ${w}×${h}`,
    `DPR:          ${window.devicePixelRatio}`,
    `Shadows:      ${renderer.shadowMap.enabled}`,
    `Total frames: ${totalFrames}`,
    '================================================',
  ].join('\n');
}

// ═══════════════════════════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════════════════════════
const clock = new THREE.Clock();

function loop() {
  requestAnimationFrame(loop);

  const ft = Math.min(clock.getDelta() * 1000, 66); // cap at ~15 fps equivalent
  const dt = ft / 1000;

  // ── Look input ──────────────────────────────────────────────────────────
  yaw   -= lookDX;
  pitch  = Math.max(-80, Math.min(80, pitch - lookDY));
  lookDX = lookDY = 0;

  // ── Movement (joystick relative to camera yaw) ──────────────────────────
  const yr  = yaw * (Math.PI / 180);
  const jx  = joystick.x;
  const jy  = joystick.y;  // negative = forward (finger up on screen)
  const fwd = -jy;          // make intuitive: push up = move forward

  // right vec = ( cos(yr), 0, -sin(yr) )
  // fwd  vec  = (-sin(yr), 0, -cos(yr) )
  const movX = (Math.cos(yr) * jx - Math.sin(yr) * fwd) * WALK_SPEED * dt;
  const movZ = (-Math.sin(yr) * jx - Math.cos(yr) * fwd) * WALK_SPEED * dt;

  playerPos.x += movX;
  resolveAxis('x');
  playerPos.z += movZ;
  resolveAxis('z');

  // ── Gravity + jump ───────────────────────────────────────────────────────
  if (jumpQueued && grounded) { velY = JUMP_VEL; grounded = false; }
  jumpQueued = false;

  velY       += GRAVITY * dt;
  playerPos.y += velY * dt;

  if (playerPos.y <= EYE_H) {
    playerPos.y = EYE_H;
    velY        = 0;
    grounded    = true;
  } else {
    grounded = false;
  }

  // ── Fire ─────────────────────────────────────────────────────────────────
  if (fireQueued) { doFire(); fireQueued = false; }

  // ── Timers ───────────────────────────────────────────────────────────────
  if (hmTimer > 0) {
    hmTimer -= dt;
    if (hmTimer <= 0) { hmEl.classList.remove('show'); xhair.classList.remove('hit'); }
  }
  if (dmgTimer > 0) {
    dmgTimer -= dt;
    const alpha = Math.min(1, dmgTimer / 0.2);
    dmgEl.style.opacity = alpha.toString();
    dmgEl.textContent   = dmgText;
    if (dmgTimer <= 0) { dmgEl.style.opacity = '0'; }
  }
  // Dummy hit-flash recovery
  for (const d of dummies) {
    if (d.hitTimer > 0) {
      d.hitTimer -= dt;
      if (d.hitTimer <= 0) { d.mesh.material.color.set(0xdd3333); }
    }
  }

  // ── Camera ───────────────────────────────────────────────────────────────
  camera.position.copy(playerPos);
  camera.rotation.y = yr;
  camera.rotation.x = pitch * (Math.PI / 180);

  // ── Render ───────────────────────────────────────────────────────────────
  renderer.info.reset();   // so render.calls reflects THIS frame only
  renderer.render(scene, camera);

  // ── Stats (after render so renderer.info is populated) ───────────────────
  updateStats(ft);
}

loop();

// ═══════════════════════════════════════════════════════════════════════════
//  SETTINGS PANEL WIRING
// ═══════════════════════════════════════════════════════════════════════════
const spanel = document.getElementById('spanel');
document.getElementById('stog').addEventListener('click', () => {
  spanel.style.display = spanel.style.display === 'block' ? 'none' : 'block';
});

// Resolution slider
const resSlider = document.getElementById('res-sl');
resSlider.addEventListener('input', () => {
  resScale = parseFloat(resSlider.value);
  applyResScale();
});

// Shadows toggle
let shadowsOn = true;
document.getElementById('shad-tog').addEventListener('change', e => {
  shadowsOn = e.target.checked;
  renderer.shadowMap.enabled = shadowsOn;
  sun.castShadow = shadowsOn;
  // Force shadow map rebuild on next render
  renderer.shadowMap.needsUpdate = true;
  scene.traverse(obj => {
    if (obj.isMesh) {
      obj.castShadow    = shadowsOn;
      obj.receiveShadow = shadowsOn;
    }
  });
});

// Stress test
document.getElementById('stress-btn').addEventListener('click', () => {
  spawnDummies(20);
  document.getElementById('stress-btn').textContent =
    `⊕ Stress Test (+20 dummies)  [total: ${dummies.length}]`;
});

// Session report
const rptEl = document.getElementById('rpt');
document.getElementById('report-btn').addEventListener('click', () => {
  const txt = sessionReport();
  console.log(txt);
  rptEl.textContent    = txt;
  rptEl.style.display  = 'block';
  navigator.clipboard?.writeText(txt).catch(() => {});
});

</script>
